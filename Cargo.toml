[package]
name = "codex-api"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"

[lib]
name = "codex_api"
path = "src/lib.rs"

[[bin]]
name = "codex-api"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "matched-path", "tokio", "ws"] }
base64 = "0.22.1"
bytes = "1.11.1"
clap = { version = "4.5.54", features = ["derive", "env"] }
comfy-table = "=7.2.1"
eventsource-stream = "0.2.3"
futures-util = { version = "0.3.33", features = ["sink"] }
http = "1.4.0"
reqwest = { version = "0.13.4", default-features = false, features = ["http2", "json", "rustls", "stream"] }
rust_decimal = "1.40.0"
secrecy = { version = "0.10.3", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", default-features = false, features = ["macros", "migrate", "runtime-tokio", "sqlite-bundled"] }
subtle = "2.6.1"
thiserror = "2.0.20"
time = { version = "0.3.47", features = ["formatting", "parsing", "serde"] }
tokio = { version = "1.53.1", features = ["macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
toml = { version = "1.1.0", default-features = false, features = ["parse", "serde", "std"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"

[dev-dependencies]
async-stream = "0.3.6"
http-body-util = "0.1.3"
tempfile = "3.27.0"
tokio-stream = "0.1.18"
