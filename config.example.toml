# Optional. When a key's weekly soft limit is exhausted, rewrite every request
# to this model until the hard limit is reached.
fallback_model = "example-model"

[server]
listen = "127.0.0.1:8080"
enable_websockets = true

[state]
path = "./codex-api.sqlite3"

[upstream]
base_url = "https://chatgpt.com/backend-api/codex"
oauth_token_url = "https://auth.openai.com/oauth/token"
auth_file = "/path/to/codex/auth.json"
supports_websockets = true

[[api_keys]]
id = "client-a"
secret = "sk-local-change-me"
weekly_limit_usd = "10.00"
# Optional hard stop for limited keys. Defaults to "600.00".
# hard_limit_usd = "600.00"

[[api_keys]]
id = "unlimited-client"
secret = "sk-local-change-this-too"

[model_prices.example-model]
input_usd_per_million = "1.00"
cached_input_usd_per_million = "0.10"
output_usd_per_million = "6.00"
# Optional. Higher requested efforts are sent upstream at this level.
max_reasoning_effort = "high"
